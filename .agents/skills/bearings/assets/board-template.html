<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bearings - fleet board</title>
<style>
/* ============================================================
   Bearings board - "Strip" layout.

   Every colour, radius, font, shadow and hairline the layout uses is a CSS
   custom property declared on :root below, and nothing beneath this block
   hard-codes one. That is the whole point: a home re-themes this board by
   redefining tokens in $FM_HOME/config/board-theme.css, which the build
   inlines into #fm-board-theme AFTER this block, without touching layout.

   The values here are the tracked NEUTRAL defaults - a system sans stack, a
   neutral dark band and a restrained accent. No licensed typeface and no
   company palette is committed to this repository.
   ============================================================ */

:root {
  /* type */
  --bb-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --bb-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bb-fs-band-num: 44px;
  --bb-fs-h2: 28px;
  --bb-fs-title: 22px;
  --bb-fs-body: 16px;
  --bb-fs-row: 15px;
  --bb-fs-sm: 14px;
  --bb-fs-eyebrow: 13px;
  --bb-fs-meta: 12px;
  --bb-fs-badge: 12px;
  --bb-fs-badge-sm: 10px;
  --bb-ls-eyebrow: 0.14em;
  --bb-ls-badge: 0.06em;

  /* colour */
  --bb-accent: #3f5c8a;          /* restrained accent */
  --bb-accent-strong: #2c4267;
  --bb-accent-soft: rgba(63, 92, 138, 0.10);
  --bb-accent-line: rgba(63, 92, 138, 0.45);
  --bb-dark: #242c35;            /* the band */
  --bb-on-dark: #ffffff;
  --bb-on-dark-quiet: rgba(255, 255, 255, 0.55);
  --bb-on-dark-hot: #9fb6d8;
  --bb-on-dark-rule: rgba(255, 255, 255, 0.20);
  --bb-ink: #242c35;             /* strong text */
  --bb-body: #475263;            /* secondary text */
  --bb-muted: #8a8f97;           /* meta text */
  --bb-page: #ffffff;
  --bb-surface: #ffffff;
  --bb-surface-alt: #f6f6f7;
  --bb-rule: #e5e5e7;
  --bb-line-soft: #d9d9d9;
  --bb-ok: #2e7d4f;
  --bb-ok-ink: #1f6b40;
  --bb-ok-soft: rgba(46, 125, 79, 0.12);
  --bb-warn-ink: #9a6c14;
  --bb-warn-soft: rgba(217, 154, 42, 0.16);
  --bb-danger: #b03a2e;
  --bb-danger-soft: rgba(176, 58, 46, 0.12);

  /* shape */
  --bb-radius-control: 6px;
  --bb-radius-card: 10px;
  --bb-radius-pill: 999px;
  --bb-hairline: 1px;
  --bb-shadow-card: 0 1px 2px rgba(36, 44, 53, 0.05);
  --bb-shadow-raised: 0 2px 8px rgba(36, 44, 53, 0.08);
  --bb-focus: 0 0 0 3px var(--bb-accent-soft);

  /* rhythm */
  --bb-gutter: 56px;
  --bb-col-gap: 56px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
[hidden] { display: none !important; }
body {
  font-family: var(--bb-font);
  font-size: var(--bb-fs-body);
  line-height: 1.55;
  color: var(--bb-ink);
  background: var(--bb-page);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--bb-accent); text-decoration: none; }
a:hover { color: var(--bb-accent-strong); }

.bb-eyebrow {
  font-weight: 600; font-size: var(--bb-fs-eyebrow); letter-spacing: var(--bb-ls-eyebrow);
  text-transform: uppercase; color: var(--bb-accent);
}
.bb-eyebrow--dark { color: var(--bb-on-dark); opacity: 0.85; }
.bb-eyebrow--quiet { color: var(--bb-muted); }
.bb-meta {
  font-weight: 500; font-size: var(--bb-fs-meta); letter-spacing: 0.02em;
  color: var(--bb-muted); line-height: 1.4;
}
.bb-mono { font-family: var(--bb-mono); font-size: var(--bb-fs-eyebrow); }

.fm-badge {
  display: inline-block; font-size: var(--bb-fs-badge); font-weight: 600;
  letter-spacing: var(--bb-ls-badge); text-transform: uppercase;
  padding: 5px 10px; border-radius: var(--bb-radius-pill); line-height: 1.2; white-space: nowrap;
}
.fm-badge--sm { font-size: var(--bb-fs-badge-sm); padding: 3px 8px; }
.fm-badge--solid   { background: var(--bb-accent-soft); color: var(--bb-accent); }
.fm-badge--outline { box-shadow: inset 0 0 0 1.5px var(--bb-accent-line); color: var(--bb-accent); }
.fm-badge--online  { background: var(--bb-ok-soft); color: var(--bb-ok-ink); }
.fm-badge--warn    { background: var(--bb-warn-soft); color: var(--bb-warn-ink); }
.fm-badge--danger  { background: var(--bb-danger-soft); color: var(--bb-danger); }
.fm-badge--info    { background: var(--bb-accent-soft); color: var(--bb-accent); }
.fm-badge--neutral { background: var(--bb-line-soft); color: var(--bb-ink); }

.fm-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--bb-font); font-weight: 600; font-size: var(--bb-fs-eyebrow);
  letter-spacing: var(--bb-ls-badge); text-transform: uppercase;
  padding: 12px 20px; border-radius: var(--bb-radius-control); border: 0;
  cursor: pointer; line-height: 1; min-height: 44px; white-space: nowrap;
}
.fm-btn--sm { min-height: 40px; padding: 10px 16px; }
.fm-btn--xs { min-height: 36px; padding: 8px 14px; font-size: var(--bb-fs-meta); }
.fm-btn--primary { background: var(--bb-accent); color: var(--bb-on-dark); }
.fm-btn--primary:hover { background: var(--bb-accent-strong); }
.fm-btn--ghost { background: transparent; color: var(--bb-accent); box-shadow: inset 0 0 0 1.5px var(--bb-accent-line); }
.fm-btn--ghost:hover { background: var(--bb-surface-alt); }
.fm-btn:focus-visible { outline: none; box-shadow: var(--bb-focus); }
.fm-btn[disabled] { opacity: 0.4; pointer-events: none; }

.bb-linkcta {
  background: none; border: 0; padding: 0 0 2px; cursor: pointer; font: inherit;
  font-weight: 600; font-size: var(--bb-fs-meta); letter-spacing: var(--bb-ls-eyebrow);
  text-transform: uppercase; color: var(--bb-accent);
  border-bottom: 2px solid var(--bb-accent);
}
.bb-linkcta:focus-visible { outline: none; box-shadow: var(--bb-focus); }

.fm-card {
  background: var(--bb-surface); border: var(--bb-hairline) solid var(--bb-rule);
  border-radius: var(--bb-radius-card); box-shadow: var(--bb-shadow-card);
}

/* ---- the band: logo, wordmark, date, four oversized metrics ---- */
.bb-band {
  background: var(--bb-dark); color: var(--bb-on-dark);
  padding: 28px var(--bb-gutter) 32px;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 520px);
  gap: 48px; align-items: center;
}
.bb-band__id { display: flex; align-items: center; gap: 20px; min-width: 0; }
.bb-band__logo { display: inline-flex; align-items: center; color: var(--bb-on-dark); }
.bb-band__logo svg { display: block; height: 34px; width: auto; }
.bb-band__wordmark {
  font-weight: 700; font-size: 26px; letter-spacing: -0.01em; line-height: 1;
  color: var(--bb-on-dark);
}
.bb-band__rule { width: 1px; height: 26px; background: var(--bb-on-dark-rule); flex: none; }
.bb-band__stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px 24px; }
.bb-stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bb-stat__num {
  font-weight: 700; font-size: var(--bb-fs-band-num); line-height: 1.05;
  letter-spacing: -0.02em; color: var(--bb-on-dark);
}
.bb-stat__label {
  font-weight: 600; font-size: var(--bb-fs-eyebrow); letter-spacing: var(--bb-ls-eyebrow);
  text-transform: uppercase; color: var(--bb-on-dark-quiet);
}
.bb-stat--hot .bb-stat__label { color: var(--bb-on-dark-hot); }

/* ---- the Underway strip ---- */
.bb-strip {
  background: var(--bb-surface-alt);
  border-bottom: var(--bb-hairline) solid var(--bb-rule);
  padding: 24px var(--bb-gutter) 28px;
  display: flex; flex-direction: column; gap: 14px;
}
.bb-strip__head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.bb-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
/* an Underway tile is still a .bb-row: same title/sub contract, tile shape */
.bb-tiles .bb-row {
  background: var(--bb-surface); border: var(--bb-hairline) solid var(--bb-rule);
  border-radius: var(--bb-radius-card); box-shadow: var(--bb-shadow-card);
  padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
}
.bb-tiles .bb-row .fm-badge { align-self: flex-start; order: -1; }
.bb-tiles .bb-row__main { display: contents; }
.bb-tiles .bb-row__title { font-weight: 600; font-size: var(--bb-fs-body); line-height: 1.3; color: var(--bb-ink); }
.bb-tiles .bb-row__sub { color: var(--bb-body); font-size: var(--bb-fs-sm); line-height: 1.4; }

/* ---- the two columns ---- */
.bb-main {
  padding: 48px var(--bb-gutter) 96px;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--bb-col-gap); align-items: start;
}
.bb-colL { display: flex; flex-direction: column; gap: 40px; min-width: 0; }
.bb-section { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.bb-section__head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.bb-section__title { margin: 6px 0 0; font-weight: 600; font-size: var(--bb-fs-h2); line-height: 1.2; }

/* ---- Captain's Call: one card at a time, flipped from the section header ---- */
.bb-stacknav { display: flex; align-items: center; gap: 8px; flex: none; }
.bb-stacknav__count { white-space: nowrap; }
.bb-stacknav__btn {
  width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center;
  border: var(--bb-hairline) solid var(--bb-line-soft); border-radius: var(--bb-radius-control);
  background: var(--bb-surface); color: var(--bb-ink); cursor: pointer;
}
.bb-stacknav__btn:hover { background: var(--bb-surface-alt); }
.bb-stacknav__btn:focus-visible { outline: none; box-shadow: var(--bb-focus); }
.bb-stacknav__btn[disabled] { opacity: 0.35; cursor: default; }
.bb-stacknav__btn svg { width: 16px; height: 16px; }

.bb-call { display: block; }
.bb-decision {
  padding: 24px; display: flex; flex-direction: column; gap: 16px;
  background: var(--bb-surface); border: var(--bb-hairline) solid var(--bb-rule);
  border-radius: var(--bb-radius-card); box-shadow: var(--bb-shadow-card);
}
.bb-decision__top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.bb-decision__repo { font-weight: 500; font-size: var(--bb-fs-meta); color: var(--bb-muted); }
.bb-decision__title { margin: 0; font-weight: 600; font-size: var(--bb-fs-title); line-height: 1.3; letter-spacing: -0.01em; }
.bb-decision__detail { margin: 0; color: var(--bb-body); font-size: var(--bb-fs-row); }
.bb-decision__link { font-family: var(--bb-mono); font-size: var(--bb-fs-eyebrow); word-break: break-all; }
.bb-ctx { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 6px 16px; font-size: var(--bb-fs-row); }
.bb-ctx__k { font-weight: 500; font-size: var(--bb-fs-meta); color: var(--bb-muted); padding-top: 3px; text-transform: uppercase; letter-spacing: 0.02em; }
.bb-ctx__v { color: var(--bb-body); min-width: 0; }
.bb-decision form { display: flex; flex-direction: column; gap: 16px; }
.bb-opts { display: flex; flex-direction: column; gap: 10px; }
.bb-opt {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px;
  border: var(--bb-hairline) solid var(--bb-rule); border-radius: var(--bb-radius-control);
  cursor: pointer; min-height: 44px; background: var(--bb-surface);
}
.bb-opt:hover { background: var(--bb-surface-alt); }
.bb-opt input { margin: 4px 0 0; accent-color: var(--bb-accent); width: 16px; height: 16px; flex: none; }
.bb-opt__body { min-width: 0; flex: 1 1 auto; }
.bb-opt__label { font-weight: 600; display: block; font-size: var(--bb-fs-row); line-height: 1.3; }
.bb-opt__hint { display: block; color: var(--bb-body); font-size: var(--bb-fs-sm); }
.bb-opt__rec {
  font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--bb-accent); margin-left: auto; align-self: center; white-space: nowrap;
}
.bb-freeform {
  flex: 1 1 200px; min-width: 0; font: inherit; font-size: var(--bb-fs-row);
  padding: 10px 12px; border: var(--bb-hairline) solid var(--bb-line-soft);
  border-radius: var(--bb-radius-control); min-height: 44px;
}
.bb-freeform:focus { outline: none; box-shadow: var(--bb-focus); border-color: var(--bb-accent-line); }
.bb-decision__foot { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.bb-queued {
  display: none; align-items: center; gap: 6px; font-size: var(--bb-fs-badge);
  font-weight: 600; letter-spacing: var(--bb-ls-badge); text-transform: uppercase;
  color: var(--bb-ok-ink); background: var(--bb-ok-soft);
  border-radius: var(--bb-radius-pill); padding: 5px 10px;
}
.is-queued .bb-queued { display: inline-flex; }
.bb-limit { display: none; font-size: var(--bb-fs-sm); font-weight: 600; color: var(--bb-danger); }
.bb-limit.is-visible { display: inline; }

/* ---- Landed: a compact hairline ledger ---- */
.bb-rows { display: flex; flex-direction: column; }
.bb-landed .bb-row {
  display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 14px;
  align-items: start; padding: 12px 0; border-top: var(--bb-hairline) solid var(--bb-rule);
}
.bb-row__check { color: var(--bb-ok); display: flex; }
.bb-row__check svg { width: 16px; height: 16px; }
.bb-landed .bb-row__title { font-size: var(--bb-fs-row); line-height: 1.35; }
.bb-landed .bb-row__sub { font-weight: 500; font-size: var(--bb-fs-meta); color: var(--bb-muted); line-height: 1.4; }
.bb-row__pr { font-family: var(--bb-mono); font-size: var(--bb-fs-eyebrow); padding-top: 2px; white-space: nowrap; }
.bb-row__pr:hover { text-decoration: underline; }

/* ---- Charted Next: project groups of expandable queue rows ---- */
.bb-group { display: block; }
.bb-group__head {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 16px 0 6px; cursor: pointer; min-height: 44px; width: 100%;
  background: none; border: 0; font: inherit; text-align: left; color: inherit;
}
.bb-group__head:focus-visible { outline: none; box-shadow: var(--bb-focus); }
.bb-group__name { display: flex; gap: 8px; align-items: center; min-width: 0; }
.bb-group__head:hover .bb-eyebrow { color: var(--bb-accent-strong); }
.bb-chev { flex: none; color: var(--bb-muted); transition: transform 200ms cubic-bezier(0.2, 0.7, 0.2, 1); }
.bb-chev svg { width: 14px; height: 14px; display: block; }
.is-open > .bb-group__head .bb-chev, .bb-row.is-open .bb-chev { transform: rotate(90deg); }

.bb-charted .bb-row {
  display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 12px;
  align-items: start; border-top: var(--bb-hairline) solid var(--bb-rule); padding: 0;
}
.bb-charted .bb-row__main {
  grid-column: 2; display: flex; flex-direction: column; min-width: 0;
}
.bb-charted .bb-row__summary {
  display: flex; gap: 10px; align-items: flex-start; padding: 10px 0;
  cursor: pointer; min-height: 44px; background: none; border: 0; font: inherit;
  text-align: left; color: inherit; width: 100%;
}
.bb-charted .bb-row__summary:focus-visible { outline: none; box-shadow: var(--bb-focus); }
.bb-charted .bb-row__summary .bb-chev { margin-top: 5px; }
.bb-charted .bb-row__title {
  font-size: var(--bb-fs-sm); line-height: 1.4; flex: 1 1 auto; min-width: 0; color: var(--bb-ink);
}
.bb-charted .bb-row__summary:hover .bb-row__title { color: var(--bb-accent); }
.bb-charted .bb-row__sub { padding: 0 0 10px 24px; font-size: var(--bb-fs-sm); color: var(--bb-body); }
.bb-charted .bb-row__badges { grid-column: 3; grid-row: 1; display: flex; gap: 6px; margin-top: 12px; }
.bb-pick { accent-color: var(--bb-accent); width: 18px; height: 18px; margin: 14px 0 0; flex: none; grid-column: 1; }
.bb-pick-spacer {
  width: 18px; height: 18px; margin-top: 14px; border-radius: 3px;
  border: 1.5px dashed var(--bb-line-soft); grid-column: 1;
}
.bb-panel {
  padding: 2px 0 14px 24px; display: flex; flex-direction: column; gap: 10px;
  font-size: var(--bb-fs-sm); color: var(--bb-body);
}
.bb-panel__facts { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 4px 12px; }
.bb-panel__foot { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding-top: 4px; }
.bb-panel__foot .fm-btn { margin-left: auto; }
.bb-row.is-removed { opacity: 0.45; }
.bb-row.is-removed .bb-row__title { text-decoration: line-through; }
.bb-undo {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 10px 0 10px 30px; font-size: var(--bb-fs-sm); color: var(--bb-body);
}

.bb-actions {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 16px 0 0; border-top: var(--bb-hairline) solid var(--bb-rule); margin-top: 16px;
}
.bb-actions__count {
  flex: 1 1 auto; font-weight: 600; font-size: var(--bb-fs-meta);
  letter-spacing: var(--bb-ls-badge); text-transform: uppercase; color: var(--bb-muted);
}
.bb-morechip {
  display: inline-flex; align-items: center; gap: 6px; margin: 12px 0 0;
  font-size: var(--bb-fs-sm); font-weight: 600; color: var(--bb-muted);
  border: 1.5px dashed var(--bb-line-soft); border-radius: var(--bb-radius-pill);
  padding: 5px 12px; width: fit-content;
}
.bb-empty { padding: 16px 0; font-size: var(--bb-fs-row); color: var(--bb-body); }

.bb-foot {
  display: flex; justify-content: flex-end;
  padding: 0 var(--bb-gutter) 40px;
}

/* the fail-closed error card replaces the board body */
.bb-error { margin: 48px var(--bb-gutter); }

@media (max-width: 980px) {
  :root { --bb-gutter: 24px; --bb-col-gap: 32px; }
  .bb-band { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .bb-main { grid-template-columns: minmax(0, 1fr); }
}
</style>
<!-- HOME-LOCAL THEME. bin/fm-bearings-board.sh build inlines
     $FM_HOME/config/board-theme.css here, after the tracked defaults above, so
     a home re-themes the board by redefining tokens only. With no such file the
     placeholder is replaced by nothing and the neutral defaults stand. -->
<style id="fm-board-theme">
__FM_BEARINGS_BOARD_THEME__
</style>
</head>
<body>

<section class="bb-band">
  <div class="bb-band__id">
    <!-- HOME-LOCAL LOGO. build inlines $FM_HOME/config/board-logo.svg here;
         with no such file the placeholder is replaced by nothing and the plain
         wordmark beside it is the whole mark. -->
    <span class="bb-band__logo" id="bb-logo">
__FM_BEARINGS_BOARD_LOGO__
</span>
    <span class="bb-band__wordmark">Bearings</span>
    <span class="bb-band__rule"></span>
    <span class="bb-eyebrow bb-eyebrow--dark" id="bb-band-date">-</span>
  </div>
  <div class="bb-band__stats" id="bb-stats"></div>
</section>

<section class="bb-strip">
  <div class="bb-strip__head">
    <span class="bb-eyebrow">Underway</span>
    <span class="bb-meta" id="bb-underway-sub"></span>
  </div>
  <div class="bb-tiles" id="bb-underway"></div>
</section>

<main class="bb-main">

  <div class="bb-colL">
    <section class="bb-section">
      <div class="bb-section__head">
        <div>
          <div class="bb-eyebrow">Captain's Call</div>
          <h2 class="bb-section__title">Decide</h2>
        </div>
        <div class="bb-stacknav" id="bb-stacknav">
          <span class="bb-meta bb-stacknav__count" id="bb-stack-count">-</span>
          <button type="button" class="bb-stacknav__btn" id="bb-stack-prev" aria-label="Previous call">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button type="button" class="bb-stacknav__btn" id="bb-stack-next" aria-label="Next call">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>
      <div class="bb-call" id="bb-call"></div>
    </section>

    <section class="bb-section">
      <div class="bb-section__head">
        <div>
          <div class="bb-eyebrow">Landed</div>
          <h2 class="bb-section__title">This week</h2>
        </div>
      </div>
      <div class="bb-rows bb-landed" id="bb-landed"></div>
    </section>
  </div>

  <section class="bb-section">
    <div class="bb-section__head">
      <div>
        <div class="bb-eyebrow">Charted Next</div>
        <h2 class="bb-section__title">Queue</h2>
      </div>
      <div class="bb-stacknav">
        <button type="button" class="bb-linkcta" id="bb-collapse-all" data-state="open">Collapse all</button>
        <button type="button" class="fm-btn fm-btn--sm fm-btn--primary" id="bb-dispatch-btn" disabled>Dispatch 0</button>
      </div>
    </div>
    <div class="bb-meta" id="bb-charted-sub"></div>
    <div class="bb-rows bb-charted" id="bb-charted"></div>
    <div class="bb-actions" id="bb-dispatch" hidden>
      <span class="bb-actions__count" id="bb-dispatch-count">pick queued work to dispatch</span>
      <span class="bb-queued" id="bb-dispatch-queued">queued</span>
    </div>
    <div class="bb-actions" id="bb-remove" hidden>
      <span class="bb-actions__count" id="bb-remove-count">nothing removed</span>
      <span class="bb-queued" id="bb-remove-queued">queued</span>
      <button type="button" class="fm-btn fm-btn--sm fm-btn--ghost" id="bb-remove-btn">Queue removals</button>
    </div>
  </section>

</main>

<footer class="bb-foot">
  <span class="bb-meta bb-mono" id="bb-provenance">-</span>
</footer>

<!-- ONE SLOT. bin/fm-bearings-board.sh build injects the fresh
     fm-bearings-board.v1 payload in place of the placeholder below; everything
     above and below is the shipped template and is never regenerated per run. -->
<script id="bearings-data" type="application/json">
__FM_BEARINGS_BOARD_DATA__
</script>

<script>
(function () {
  "use strict";

  /* Fail closed: a board with unreadable or wrong-schema data says so plainly
     instead of rendering an empty page that looks like an empty fleet. */
  function renderBoardError(msg) {
    var band = document.getElementById("bb-stats");
    if (band) { band.innerHTML = ""; }
    var bandDate = document.getElementById("bb-band-date");
    if (bandDate) { bandDate.textContent = "-"; }
    var strip = document.querySelector(".bb-strip");
    if (strip) { strip.hidden = true; }
    var main = document.querySelector(".bb-main");
    main.innerHTML = "";
    var card = document.createElement("div");
    card.className = "fm-card bb-decision bb-error";
    var h = document.createElement("h3");
    h.className = "bb-decision__title";
    h.textContent = "This board could not load";
    var d = document.createElement("p");
    d.className = "bb-decision__detail";
    d.textContent = msg + " - ask firstmate to rebuild the board.";
    card.appendChild(h);
    card.appendChild(d);
    main.appendChild(card);
  }

  var data;
  try {
    data = JSON.parse(document.getElementById("bearings-data").textContent);
  } catch (e) {
    renderBoardError("The board data is not valid JSON");
    return;
  }
  if (!data || data.schema !== "fm-bearings-board.v1") {
    renderBoardError("Unsupported board data schema: " + (data && data.schema ? data.schema : "(none)"));
    return;
  }
  var fleetLists = [data.captains_call, data.underway, data.landed, data.charted];
  var callItemsValid = Array.isArray(data.captains_call) && data.captains_call.every(function (item) {
    return item && typeof item === "object" &&
      typeof item.key === "string" && item.key.length > 0 &&
      typeof item.type === "string" && item.type.length > 0 &&
      typeof item.title === "string" && item.title.length > 0 &&
      Array.isArray(item.options);
  });
  if (!fleetLists.every(Array.isArray) || !callItemsValid) {
    renderBoardError("The board data does not have the required structure");
    return;
  }

  try {
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function badge(tone, text, small) {
    return el("span", "fm-badge fm-badge--" + tone + (small ? " fm-badge--sm" : ""), text);
  }
  function icon(cls, path) {
    var n = el("span", cls);
    n.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + path + '"/></svg>';
    return n;
  }
  var CHEVRON = "m9 18 6-6-6-6";
  var TICK = "M20 6 9 17l-5-5";
  function chevron() { return icon("bb-chev", CHEVRON); }

  /* Warnings ride the charted feed for layout only; they are alarms, not work,
     so every count of queued work excludes them. */
  function isWarning(t) { return t && t.kind === "warning"; }
  function chartedQueued(rows) { return (rows || []).filter(function (t) { return !isWarning(t); }); }
  /* Charted Next reads newest filed first, so the most recently filed upcoming
     work is at the top. ISO filed dates compare as text; a row with no
     comparable date keeps its payload order after every dated row. */
  function chartedOrder(rows) {
    var dated = [], undated = [];
    (rows || []).forEach(function (t) {
      if (t && typeof t.filed === "string" && t.filed) dated.push(t); else undated.push(t);
    });
    dated.sort(function (a, b) { return a.filed < b.filed ? 1 : (a.filed > b.filed ? -1 : 0); });
    return dated.concat(undated);
  }
  var chartedMoreQueued = data.charted_more || 0;
  var chartedMoreWarnings = data.charted_warning_more || 0;
  function utf8ByteLength(text) { return new TextEncoder().encode(text).length; }

  document.getElementById("bb-provenance").textContent = data.schema + " · " + data.generated;
  /* the band carries the date in the captain's terms, with the durable
     generated stamp still readable in the footer */
  var bandDate = data.generated;
  try {
    var parsed = new Date(data.generated);
    if (!isNaN(parsed.getTime())) {
      bandDate = parsed.toLocaleDateString(undefined,
        { weekday: "long", day: "numeric", month: "long" });
    }
  } catch (e) { /* the raw stamp is a correct fallback */ }
  document.getElementById("bb-band-date").textContent = bandDate;

  /* band metrics: need you, underway, ready to dispatch, landed */
  var callTotal = data.captains_call.length;
  var queuedRows = chartedQueued(data.charted);
  var readyRows = queuedRows.filter(function (t) { return t.dispatchable; });
  var stats = [
    { n: callTotal, l: "need you", hot: true },
    { n: data.underway.length, l: "underway" },
    { n: readyRows.length, l: "ready to dispatch" },
    { n: data.landed.length, l: "landed" }
  ];
  var strip = document.getElementById("bb-stats");
  stats.forEach(function (s) {
    var t = el("div", "bb-stat" + (s.hot ? " bb-stat--hot" : ""));
    t.appendChild(el("span", "bb-stat__num", String(s.n)));
    t.appendChild(el("span", "bb-stat__label", s.l));
    strip.appendChild(t);
  });

  /* Captain's Call deck: every item renders as the same full card */
  var deck = document.getElementById("bb-call");
  function ctxRow(k, v) {
    var frag = [el("span", "bb-ctx__k", k), el("span", "bb-ctx__v", v)];
    return frag;
  }

  data.captains_call.forEach(function (item) {
    var card = el("div", "fm-card bb-decision");

    var top = el("div", "bb-decision__top");
    if (item.type === "merge") {
      top.appendChild(badge("online", "checks green"));
      top.appendChild(badge(item.risk === "low" ? "neutral" : "warn", "risk " + item.risk));
    } else {
      top.appendChild(badge("solid", "decision"));
      top.appendChild(el("span", "bb-decision__repo", item.repo));
    }
    card.appendChild(top);

    card.appendChild(el("h3", "bb-decision__title", item.title));

    if (item.type === "merge") {
      if (item.detail) card.appendChild(el("p", "bb-decision__detail", item.detail));
      if (item.pr_url) {
        var pr = el("a", "bb-decision__link", item.pr_url);
        pr.href = item.pr_url; pr.target = "_blank"; pr.rel = "noopener";
        card.appendChild(pr);
      }
    } else {
      /* the rec marker on the option itself carries the recommendation */
      var ctx = el("div", "bb-ctx");
      if (item.about) ctxRow("About", item.about).forEach(function (n) { ctx.appendChild(n); });
      if (item.decide) ctxRow("Decide", item.decide).forEach(function (n) { ctx.appendChild(n); });
      card.appendChild(ctx);
    }

    var form = document.createElement("form");
    form.setAttribute("data-lavish-question", item.key);
    var opts = el("div", "bb-opts");
    item.options.forEach(function (o) {
      var lab = el("label", "bb-opt");
      var input = document.createElement("input");
      input.type = "radio"; input.name = "answer"; input.value = o.value;
      lab.appendChild(input);
      var body = el("span", "bb-opt__body");
      body.appendChild(el("span", "bb-opt__label", o.label));
      if (o.hint) body.appendChild(el("span", "bb-opt__hint", o.hint));
      lab.appendChild(body);
      if (item.recommend_value && o.value === item.recommend_value) {
        lab.appendChild(el("span", "bb-opt__rec", "recommended"));
      }
      opts.appendChild(lab);
    });
    form.appendChild(opts);

    var foot = el("div", "bb-decision__foot");
    var btn = el("button", "fm-btn fm-btn--sm fm-btn--primary", "Queue answer");
    btn.type = "submit";
    foot.appendChild(btn);

    if (item.allow_freeform) {
      var ff = document.createElement("input");
      ff.type = "text"; ff.name = "note"; ff.className = "bb-freeform";
      ff.placeholder = item.freeform_hint || "or answer in your own words";
      foot.appendChild(ff);
    }

    var q = el("span", "bb-queued");
    q.appendChild(icon("bb-row__check", TICK));
    q.appendChild(el("span", null, "queued"));
    foot.appendChild(q);
    var answerLimit = el("span", "bb-limit");
    answerLimit.setAttribute("role", "alert");
    foot.appendChild(answerLimit);
    form.appendChild(foot);

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      answerLimit.classList.remove("is-visible");
      var fd = new FormData(form);
      var value = fd.get("answer");
      var note = (fd.get("note") || "").trim();
      var displayAnswer = value ? (note ? value + " - " + note : value) : note;
      if (!displayAnswer) return;
      if (utf8ByteLength(displayAnswer) > 512) {
        answerLimit.textContent = "Answer is too long to queue (512 bytes maximum).";
        answerLimit.classList.add("is-visible");
        return;
      }
      if (window.lavish && window.lavish.queuePrompt) {
        /* The versioned context keeps the selected option separate from its
           note, while close carries the composer-declared completion mode. */
        var ctxData = {
          schema: "fm-bearings-answer.v1",
          question: item.key,
          selection: value || "",
          note: note
        };
        if (item.close) ctxData.close = item.close;
        window.lavish.queuePrompt(
          "Captain's Call answer - " + item.title + ": " + displayAnswer,
          { tag: "choice", text: item.title + " -> " + displayAnswer, element: form,
            data: ctxData }
        );
      }
      card.classList.add("is-queued");
      /* deal the next card once this one is answered */
      setTimeout(function () { showCard(active < cards.length - 1 ? active + 1 : active); }, 450);
    });

    card.appendChild(form);
    deck.appendChild(card);
  });

  /* deck navigation: one card at a time, flipped from the section header */
  var cards = Array.prototype.slice.call(deck.children);
  var active = 0;
  var stackCount = document.getElementById("bb-stack-count");
  var stackPrev = document.getElementById("bb-stack-prev");
  var stackNext = document.getElementById("bb-stack-next");
  var stackNav = document.getElementById("bb-stacknav");
  function showCard(i) {
    active = Math.max(0, Math.min(cards.length - 1, i));
    cards.forEach(function (c, j) { c.hidden = j !== active; });
    var answered = deck.querySelectorAll(".is-queued").length;
    stackCount.textContent = (active + 1) + " of " + cards.length +
      (answered ? " · " + answered + " answered" : "");
    stackPrev.disabled = active === 0;
    stackNext.disabled = active === cards.length - 1;
  }
  if (cards.length) {
    stackPrev.addEventListener("click", function () { showCard(active - 1); });
    stackNext.addEventListener("click", function () { showCard(active + 1); });
    showCard(0);
  } else {
    deck.appendChild(el("div", "bb-empty", "Nothing needs your action right now."));
    stackNav.hidden = true;
  }

  /* Underway: one tile per live worker */
  var uw = document.getElementById("bb-underway");
  document.getElementById("bb-underway-sub").textContent =
    data.underway.length + " worker" + (data.underway.length === 1 ? "" : "s") + " live";
  if (!data.underway.length) uw.appendChild(el("div", "bb-empty", "Nothing is underway."));
  data.underway.forEach(function (t) {
    var row = el("div", "bb-row");
    row.appendChild(badge(t.state === "working" ? "online" : "warn", t.state));
    var main = el("div", "bb-row__main");
    /* the snapshot's durable name-or-id label leads the tile so a scan says
       WHICH task this is; the run status keeps its place on the second line */
    main.appendChild(el("div", "bb-row__title", t.name));
    /* captain-facing rows name the repo; the internal task id shows only when
       no repo is known */
    main.appendChild(el("div", "bb-row__sub",
      t.doing + " · " + t.kind + " · " + (t.repo || t.id)));
    row.appendChild(main);
    uw.appendChild(row);
  });

  /* Landed */
  var ld = document.getElementById("bb-landed");
  if (!data.landed.length) ld.appendChild(el("div", "bb-empty", "No recent completions are in the current baseline."));
  data.landed.forEach(function (t) {
    var row = el("div", "bb-row");
    row.appendChild(icon("bb-row__check", TICK));
    var main = el("div", "bb-row__main");
    main.appendChild(el("div", "bb-row__title", t.what));
    main.appendChild(el("div", "bb-row__sub", (t.repo || t.id) + " · " + t.owner));
    row.appendChild(main);
    if (t.pr_url) {
      var a = el("a", "bb-row__pr", "#" + t.pr_url.split("/").pop());
      a.href = t.pr_url; a.title = t.pr_url; a.target = "_blank"; a.rel = "noopener";
      row.appendChild(a);
    }
    ld.appendChild(row);
  });

  /* ---- Charted Next: project groups of expandable rows ---- */
  var ch = document.getElementById("bb-charted");
  var dispatchBar = document.getElementById("bb-dispatch");
  var dispatchCount = document.getElementById("bb-dispatch-count");
  var dispatchBtn = document.getElementById("bb-dispatch-btn");
  var removeBar = document.getElementById("bb-remove");
  var removeCount = document.getElementById("bb-remove-count");
  var removeBtn = document.getElementById("bb-remove-btn");
  var collapseAll = document.getElementById("bb-collapse-all");
  var groups = [];
  var removed = [];
  var removeQueued = false;
  var anyPickable = false;

  function pickedIds() {
    return Array.prototype.map.call(ch.querySelectorAll(".bb-pick:checked"), function (c) { return c.value; });
  }
  function refreshDispatch(limitMessage) {
    var n = pickedIds().length;
    dispatchCount.textContent = limitMessage || (n ? n + " picked for dispatch" : "pick queued work to dispatch");
    dispatchBtn.textContent = "Dispatch " + n;
    dispatchBtn.disabled = !n;
  }
  function refreshRemove(limitMessage) {
    removeBar.hidden = removed.length === 0;
    removeCount.textContent = limitMessage ||
      (removed.length ? removed.length + " removed from the queue" : "nothing removed");
    removeBtn.disabled = !removed.length;
  }
  /* The captain keeps editing the list after queueing it, so every later change
     re-queues under the one remove.charted key and the last list wins - an
     emptied list included, which queues an explicit "drop nothing". */
  function queueRemovals() {
    var removeAnswer = removed.join(",");
    if (utf8ByteLength(removeAnswer) > 512) {
      refreshRemove("Removal list is too long to queue (512 bytes maximum). ");
      return false;
    }
    if (window.lavish && window.lavish.queuePrompt) {
      window.lavish.queuePrompt(
        removed.length
          ? "Remove from the queue - drop this queued work from the backlog: " + removed.join(", ")
          : "Remove from the queue - the captain took every removal back; drop nothing.",
        { tag: "choice",
          text: removed.length ? "Remove: " + removed.join(", ") : "Remove: nothing",
          element: removeBar,
          queueKey: "remove.charted",
          data: { question: "remove.charted", answer: removeAnswer } }
      );
    }
    removeQueued = true;
    return true;
  }

  if (!queuedRows.length && !chartedMoreQueued) {
    ch.appendChild(el("div", "bb-empty", "Nothing is queued."));
  }

  /* Rows group by project, newest filed first inside each group; the groups
     themselves follow the order their newest row appears in. */
  var ordered = chartedOrder(data.charted);
  var groupIndex = {};
  ordered.forEach(function (t) {
    var name = t.repo || t.id;
    if (!groupIndex[name]) {
      groupIndex[name] = { name: name, rows: [] };
      groups.push(groupIndex[name]);
    }
    groupIndex[name].rows.push(t);
  });

  groups.forEach(function (group) {
    var box = el("div", "bb-group is-open");
    var head = el("button", "bb-group__head");
    head.type = "button";
    head.setAttribute("aria-expanded", "true");
    var nameWrap = el("span", "bb-group__name");
    nameWrap.appendChild(chevron());
    nameWrap.appendChild(el("span", "bb-eyebrow", group.name));
    head.appendChild(nameWrap);
    /* a group's counts are counts of queued WORK; the alarms riding this feed
       are never queued and never ready */
    var groupQueued = chartedQueued(group.rows).length;
    var ready = group.rows.filter(function (t) { return t.dispatchable && !isWarning(t); }).length;
    head.appendChild(el("span", "bb-meta", groupQueued + " queued · " + ready + " ready"));
    var body = el("div", "bb-group__body");
    function setGroupOpen(open) {
      body.hidden = !open;
      head.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) box.classList.add("is-open"); else box.classList.remove("is-open");
    }
    head.addEventListener("click", function () {
      setGroupOpen(!box.classList.contains("is-open"));
    });
    box.appendChild(head);
    box.appendChild(body);
    group.box = box;
    group.setOpen = setGroupOpen;

    group.rows.forEach(function (t) {
      var row = el("div", "bb-row");
      var pick = null;
      if (t.dispatchable && !isWarning(t)) {
        anyPickable = true;
        pick = document.createElement("input");
        pick.type = "checkbox"; pick.className = "bb-pick"; pick.value = t.id;
        pick.setAttribute("aria-label", "Pick " + t.id + " for dispatch");
        pick.addEventListener("change", function () {
          if (pick.checked && utf8ByteLength(pickedIds().join(",")) > 512) {
            pick.checked = false;
            refreshDispatch("Selection limit reached (512 bytes maximum). ");
            return;
          }
          refreshDispatch();
        });
        row.appendChild(pick);
      } else {
        row.appendChild(el("span", "bb-pick-spacer"));
      }

      var main = el("div", "bb-row__main");
      /* A warning is an alarm, not queued work: it states its reason flat on
         the row, with no chevron, no detail panel and no removal, because
         there is nothing here for the captain to dispatch or drop. */
      if (isWarning(t)) {
        main.appendChild(el("div", "bb-row__title", t.title));
        main.appendChild(el("div", "bb-row__sub",
          t.reason ? t.reason + " · " + (t.repo || t.id) : (t.repo || t.id)));
        row.appendChild(main);
        row.appendChild(badge("danger", "needs repair", true));
        body.appendChild(row);
        return;
      }
      var summary = el("button", "bb-row__summary");
      summary.type = "button";
      summary.setAttribute("aria-expanded", "false");
      summary.appendChild(chevron());
      summary.appendChild(el("div", "bb-row__title", t.title));
      main.appendChild(summary);

      var panel = el("div", "bb-panel");
      panel.hidden = true;
      var facts = el("div", "bb-panel__facts");
      function fact(k, v) {
        facts.appendChild(el("span", "bb-meta", k));
        facts.appendChild(el("span", null, v));
      }
      if (t.filed) fact("Filed", t.filed);
      if (t.task_kind) {
        fact("Delivers", t.task_kind === "scout"
          ? "A report in the task record, no code change."
          : "A pull request on the project's default branch.");
      }
      fact("Project", t.repo || t.id);
      if (t.context) fact("Context", t.context);
      if (t.reason) fact("Blocked", t.reason);
      /* the durable routing id IS the task record reference; the payload
         carries no task URL, so nothing here is invented */
      fact("Task record", t.id);
      panel.appendChild(facts);

      var panelFoot = el("div", "bb-panel__foot");
      var rmBtn = el("button", "fm-btn fm-btn--xs fm-btn--ghost", "Remove from queue");
      rmBtn.type = "button";
      panelFoot.appendChild(rmBtn);
      panel.appendChild(panelFoot);
      main.appendChild(panel);
      row.appendChild(main);

      function setRowOpen(open) {
        panel.hidden = !open;
        summary.setAttribute("aria-expanded", open ? "true" : "false");
        if (open) row.classList.add("is-open"); else row.classList.remove("is-open");
      }
      summary.addEventListener("click", function () {
        setRowOpen(!row.classList.contains("is-open"));
      });

      var badges = el("div", "bb-row__badges");
      if (t.task_kind) badges.appendChild(badge(t.task_kind === "scout" ? "outline" : "solid", t.task_kind, true));
      if (t.reason) badges.appendChild(badge("warn", "waiting", true));
      row.appendChild(badges);

      body.appendChild(row);

      /* Removing strikes the row, clears its dispatch tick, and offers Undo.
         Undo takes the id back out, before or after the removals are queued. */
      var undo = el("div", "bb-undo");
      undo.hidden = true;
      undo.appendChild(el("span", null,
        "Removed from the queue. Firstmate drops it from the backlog when you send."));
      var undoBtn = el("button", "bb-linkcta", "Undo");
      undoBtn.type = "button";
      undo.appendChild(undoBtn);
      body.appendChild(undo);

      rmBtn.addEventListener("click", function () {
        if (removed.indexOf(t.id) !== -1) return;
        var next = removed.concat([t.id]).join(",");
        if (utf8ByteLength(next) > 512) {
          refreshRemove("Removal limit reached (512 bytes maximum). ");
          return;
        }
        removed.push(t.id);
        row.classList.add("is-removed");
        setRowOpen(false);
        if (pick) { pick.checked = false; pick.disabled = true; }
        undo.hidden = false;
        refreshDispatch();
        refreshRemove();
        if (removeQueued) queueRemovals();
      });
      undoBtn.addEventListener("click", function () {
        var at = removed.indexOf(t.id);
        if (at !== -1) removed.splice(at, 1);
        row.classList.remove("is-removed");
        if (pick) pick.disabled = false;
        undo.hidden = true;
        refreshRemove();
        if (removeQueued) queueRemovals();
      });
    });

    ch.appendChild(box);
  });

  var chartedShown = queuedRows.length;
  var chartedTotal = chartedShown + chartedMoreQueued;
  document.getElementById("bb-charted-sub").textContent =
    chartedMoreQueued
      ? "showing " + chartedShown + " of " + chartedTotal + " queued · " + readyRows.length + " ready"
      : (chartedShown ? chartedShown + " queued · " + readyRows.length + " ready" : "");
  if (chartedMoreQueued) {
    ch.appendChild(el("span", "bb-morechip", "+" + chartedMoreQueued + " more queued - ask firstmate for the full chart"));
  }
  if (chartedMoreWarnings) {
    ch.appendChild(el("span", "bb-morechip", "+" + chartedMoreWarnings + " more repair warning" + (chartedMoreWarnings === 1 ? "" : "s") + " - ask firstmate for the full chart"));
  }

  collapseAll.addEventListener("click", function () {
    var open = collapseAll.getAttribute("data-state") === "open";
    groups.forEach(function (g) { g.setOpen(!open); });
    collapseAll.setAttribute("data-state", open ? "closed" : "open");
    collapseAll.textContent = open ? "Expand all" : "Collapse all";
  });

  if (anyPickable) {
    dispatchBar.hidden = false;
    refreshDispatch();
    dispatchBtn.addEventListener("click", function () {
      var ids = pickedIds();
      var dispatchAnswer = ids.join(",");
      if (!ids.length) return;
      if (utf8ByteLength(dispatchAnswer) > 512) {
        refreshDispatch("Selection is too long to queue (512 bytes maximum). ");
        return;
      }
      if (window.lavish && window.lavish.queuePrompt) {
        window.lavish.queuePrompt(
          "Dispatch order - start this queued work now: " + ids.join(", "),
          { tag: "choice", text: "Dispatch: " + ids.join(", "), element: dispatchBar,
            queueKey: "dispatch.charted",
            data: { question: "dispatch.charted", answer: dispatchAnswer } }
        );
      }
      dispatchBar.classList.add("is-queued");
    });
  } else {
    dispatchBtn.disabled = true;
  }

  refreshRemove();
  removeBtn.addEventListener("click", function () {
    if (!removed.length) return;
    if (!queueRemovals()) return;
    removeBar.classList.add("is-queued");
  });
  } catch (e) {
    renderBoardError("The board data could not be rendered");
  }
})();
</script>
</body>
</html>
